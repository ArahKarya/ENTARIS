# ============================================================================
# Entaris — Docker Compose Project
#
# Setup:
#   cp .env.docker.example .env
#   nano .env                          # ganti JWT_SECRET!
#   docker compose up -d --build       # build & start
#   docker compose logs -f app         # lihat log
#
# Update aplikasi:
#   git pull
#   docker compose up -d --build       # rebuild app saja, data tetap aman
#
# Backup database:
#   docker compose exec db pg_dump -U keuangan keuangan_db > backup.sql
# ============================================================================

# Lock project name explicitly so renaming the folder doesn't break the
# existing volumes/network/container names. Project = aplikasi-keuangan-pmd
# regardless of working directory.
name: aplikasi-keuangan-pmd

services:
  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keuangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keuangan_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-keuangan_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keuangan}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application (API + Frontend) ──────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-keuangan}:${POSTGRES_PASSWORD:-keuangan_secret_2026}@db:5432/${POSTGRES_DB:-keuangan_db}?schema=public"
      PORT: "3001"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET wajib diisi di .env}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:5173}"
      APP_BASE_URL: "${APP_BASE_URL:-}"
      # Opsional: parent domain cookie sesi, hanya perlu bila sesi dibagi
      # lintas subdomain (kosong = host-only, default).
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      # Zona waktu bisnis untuk filter tanggal (default WIB).
      APP_UTC_OFFSET: "${APP_UTC_OFFSET:-+07:00}"
      # Zona waktu proses server (batas periode laporan). Default WIB.
      TZ: "${TZ:-Asia/Jakarta}"
      NODE_ENV: "production"
      UPLOADS_DIR: "/app/uploads"
      # ── AIRA MCP (/mcp) — kunci enkripsi signing secret token MCP (AES-256-GCM, HKDF). ──
      # OPSIONAL: kosong = diturunkan dari JWT_SECRET (memutar JWT_SECRET lalu butuh rotate-secret
      # semua token MCP). Disarankan diisi terpisah (>= 32 karakter acak).
      MCP_SECRET_KEY: "${MCP_SECRET_KEY:-}"
      # ── AIRA panel chat (M4.5) — ERP proxy ke aira-core via network aira-net (DNS container). ──
      AIRA_CORE_BASE_URL: "${AIRA_CORE_BASE_URL:-http://aira-core:8080}"
      # AIRA panel auth - Bearer token utk proxy ke aira-core (/v1/*). OPSIONAL (panel chat; akan diarahkan ke engine AIRA pada tahap 3).
      AIRA_API_TOKEN: "${AIRA_API_TOKEN:-}"
    volumes:
      - backups:/app/server/backups
      - uploads:/app/uploads
    networks:
      - default
      - aira-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
  uploads:

networks:
  # Network milik proyek agentic-erp (aira-core). External: dibuat oleh compose AIRA.
  # ERP join ke sini supaya server bisa proxy /api/ai/chat → http://aira-core:8080.
  aira-net:
    external: true
    name: agentic-erp_aira-net
