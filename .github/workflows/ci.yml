name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (lint, types, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Fails on any ESLint error not baselined in eslint-suppressions.json.
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  server:
    name: Server (types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Placeholder only: prisma generate / unit tests never connect to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      # Unit tests only; integration tests (npm run test:integration) need Postgres and are not part of CI yet.
      - run: npm test
      # Katalog tool AIRA/MCP: drift guard (route <-> registry, docs/ai-tools mutakhir).
      - run: npm run ai-tools:check
