name: Release

# Push a tag like v4.1.0 -> verifies version sync -> publishes a GitHub Release
# with the matching CHANGELOG.md section as notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must be on main
        run: |
          git fetch origin main --depth=200
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Version in sync with tag
        run: node scripts/bump-version.js --check --tag "$GITHUB_REF_NAME"
      - name: Extract release notes
        run: node scripts/bump-version.js --notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "Entaris ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md --verify-tag --latest
          fi
