server {
    listen 3005;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Foto/lampiran GA (aset, work order, dokumen) disimpan & di-serve oleh
    # backend ERP (app:3001), bukan oleh EAM sendiri. Proxy /uploads/* ke
    # sana supaya <img src="/uploads/..."> di client EAM benar-benar
    # menampilkan file, bukan 404 dari static server EAM.
    location /uploads/ {
        proxy_pass http://app:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html always revalidates
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
