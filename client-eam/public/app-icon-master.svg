<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- EAM App Icon — "E" monogram
       Konsep: huruf E putih bold di rounded square teal/emerald (beda total
       dari ERP yang biru steel). Aksen tag kuning kecil di ujung bawah E =
       representasi label aset (asset tag). Path-based, font-free. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd271"/>
      <stop offset="100%" stop-color="#e6a623"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.20"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- "E" monogram: 3 horizontal bars + vertical stem, bold geometric -->
  <g filter="url(#softShadow)">
    <path
      fill="#ffffff"
      d="
        M 140 96
        L 372 96
        L 372 168
        L 212 168
        L 212 228
        L 344 228
        L 344 296
        L 212 296
        L 212 344
        L 372 344
        L 372 416
        L 140 416
        Z
      "/>
  </g>

  <!-- Asset-tag accent: small rounded tag with hole, bottom-right of the E,
       representasi label aset fisik (beda konsep dari grain dot ERP) -->
  <g filter="url(#softShadow)">
    <path
      fill="url(#tag)"
      fill-rule="evenodd"
      d="
        M 300 356
        L 380 356
        L 408 384
        L 380 412
        L 300 412
        Z

        M 360 372
        m -9 0
        a 9 9 0 1 0 18 0
        a 9 9 0 1 0 -18 0
      "/>
  </g>
</svg>
